name: Build Android APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: |
          echo "VITE_API_BASE=http://10.168.1.101:3013/api" > .env.production
          npm run build

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Build APKs (Debug + Release)
        working-directory: frontend/android
        run: sh gradlew assembleDebug assembleRelease -x lint

      - name: Rename APKs
        run: |
          mkdir -p release-apks
          for apk in frontend/android/app/build/outputs/apk/debug/*.apk; do
            name=$(basename "$apk" .apk)
            cp "$apk" "release-apks/clip-script-v${{ github.ref_name }}-$name.apk"
          done
          echo "Built APKs:"
          ls -la release-apks/

      - name: Upload APKs (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: clip-script-apks
          path: release-apks/

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          generate_release_notes: true
          files: release-apks/*.apk
